<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>すばらしきSteamゲームの本棚｜Balatro・Stardew Valley・RimWorld・Undertaleなどおすすめインディーゲーム</title>
<meta name="description" content="Balatro、Stardew Valley、RimWorld、Undertale、Disco Elysium、Vampire Survivors、Inscryption、Papers Pleaseなど厳選インディーゲームのセール・価格情報。毎日自動更新。">
<meta name="keywords" content="Steam,セール,ゲーム,価格,インディーゲーム,PCゲーム,おすすめ,Balatro,Stardew Valley,RimWorld,Undertale,Disco Elysium,Vampire Survivors">
<link rel="canonical" href="https://steam.subara3.com/">
<link rel="alternate" hreflang="x-default" href="https://steam.subara3.com/">
<link rel="sitemap" type="application/xml" href="https://steam.subara3.com/sitemap.xml">
<meta name="theme-color" content="#0b1015">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="すばらしきSteamゲームの本棚｜Balatro・Stardew Valleyなどおすすめインディーゲーム">
<meta property="og:description" content="Balatro、Stardew Valley、RimWorld、Undertale、Disco Elysiumなど厳選インディーゲームのセール・価格情報。">
<meta property="og:url" content="https://steam.subara3.com/">
<meta property="og:site_name" content="すばらしきSteamゲームの本棚">
<meta property="og:locale" content="ja_JP">
<meta property="og:image" content="https://steam.subara3.com/img/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="すばらしきSteamゲームの本棚｜Balatro・Stardew Valleyなどおすすめインディーゲーム">
<meta name="twitter:description" content="Balatro、Stardew Valley、RimWorld、Undertaleなど厳選インディーゲームのセール・価格情報。">
<meta name="twitter:image" content="https://steam.subara3.com/img/ogp.png">
<link rel="dns-prefetch" href="https://cdn.akamai.steamstatic.com">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://cdn.akamai.steamstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<link rel="stylesheet" href="style.css?v=202609231845">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "すばらしきSteamゲームの本棚",
  "alternateName": "The Wonderful Steam Game Shelf",
  "url": "https://steam.subara3.com/",
  "description": "おすすめSteamゲームのセール・価格情報と紹介記事",
  "inLanguage": ["ja", "en"],
  "publisher": {
    "@type": "Organization",
    "name": "栖王ヴァルハラ３丁目",
    "url": "https://subara3.com/"
  }
}
</script>
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7086371722392050"
     crossorigin="anonymous"></script>
<script src="i18n-data.js?v=202609231845"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body>

<div class="container" x-data="dashboard()" x-init="init()" x-cloak>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="header-card">
      <div class="header-top-row">
        <h1 class="site-title" x-text="t('siteTitle')">すばらしきSteamゲームの本棚</h1>
        <div class="lang-switch">
          <button type="button" :class="lang === 'ja' ? 'lang-active' : ''" :aria-pressed="lang === 'ja'" @click="switchLang('ja')">JP</button>
          <button type="button" :class="lang === 'en' ? 'lang-active' : ''" :aria-pressed="lang === 'en'" @click="switchLang('en')">EN</button>
        </div>
      </div>
      <p class="site-description" x-text="t('siteDesc')"></p>
      <div class="header-meta">
        <span class="header-badge header-badge-date" x-text="lastUpdate ? `${t('lastUpdate')}: ${lastUpdate}` : t('loading')"></span>
        <span class="header-badge header-badge-count" x-text="`${t('gameList')}: ${mainGames.length} ${t('titles')}　${t('tools')}: ${toolGames.length} ${t('titles')}`"></span>
      </div>
    </div>
  </header>

  <!-- 直近のベスト！ -->
  <template x-if="featuredGame">
    <section class="featured-section">
      <h2 class="shelf-heading"><span x-text="t('featured')"></span></h2>
      <a :href="featuredGame.has_article ? articlePath(featuredGame.slug) : `https://store.steampowered.com/app/${featuredGame.appid}/`"
         :target="featuredGame.has_article ? '_self' : '_blank'"
         :rel="featuredGame.has_article ? '' : 'noopener'"
         class="featured-card">
        <div class="featured-img-wrap">
          <img :src="featuredGame.header_image" :alt="gameName(featuredGame)" class="featured-img" width="460" height="215">
        </div>
        <div class="featured-body">
          <p class="featured-eyebrow" x-show="lang === 'ja' && featuredGame.comment && gameDesc(featuredGame) !== featuredGame.comment" x-text="featuredGame.comment"></p>
          <h3 class="featured-name" x-text="gameName(featuredGame)"></h3>
          <p class="featured-desc" x-text="gameDesc(featuredGame)"></p>
          <div class="featured-meta">
            <span class="curator-stamp">
              <img src="img/scala.png" alt="Dr.スカラ" class="recommend-avatar" x-show="!featuredGame.by || featuredGame.by === 'scala' || featuredGame.by === 'both'">
              <img src="img/kotori.png" alt="ことり" class="recommend-avatar" x-show="featuredGame.by === 'kotori' || featuredGame.by === 'both'">
            </span>
            <span class="recommend-badge" :class="featuredGame.recommend === 'niche' ? 'recommend-niche' : 'recommend-all'" x-text="featuredGame.recommend === 'niche' ? t('recommendNiche') : t('recommendAll')"></span>
            <span class="review-label" x-show="featuredGame.review_score_desc" x-text="reviewText(featuredGame)"></span>
            <span class="featured-price">
              <template x-if="featuredGame.discount_percent > 0"><span class="discount-badge" x-text="`-${featuredGame.discount_percent}%`"></span></template>
              <span class="price-final" :class="featuredGame.discount_percent > 0 ? 'price-sale' : ''" x-text="featuredGame.is_free ? t('free') : formatYen(featuredGame.price_final)"></span>
            </span>
          </div>
          <span class="featured-cta" x-text="featuredGame.has_article ? t('featuredReadArticle') : t('featuredSteam')"></span>
        </div>
      </a>
    </section>
  </template>

  <!-- セール中バナー -->
  <template x-if="onSaleGames.length > 0">
    <section class="sale-banner">
      <div class="shelf-heading-row">
        <h2 class="shelf-heading shelf-heading-sale"><span x-text="t('onSale')"></span></h2>
      </div>
      <div class="sale-cards">
        <template x-for="g in onSaleGames" :key="g.appid">
          <a :href="`https://store.steampowered.com/app/${g.appid}/`" target="_blank" rel="noopener" class="sale-card">
            <div class="sale-img-wrap">
              <img :src="g.header_image" :alt="gameName(g)" loading="lazy" width="460" height="215">
              <span class="sale-stamp" x-text="`-${g.discount_percent}%`"></span>
            </div>
            <div class="sale-info">
              <span class="sale-name" x-text="gameName(g)" :title="gameName(g)"></span>
              <span class="sale-prices">
                <span class="price-original" x-text="formatYen(g.price_initial)"></span>
                <span class="sale-price" x-text="formatYen(g.price_final)"></span>
              </span>
            </div>
          </a>
        </template>
      </div>
    </section>
  </template>

  <!-- 2カラムレイアウト -->
  <div class="layout">

    <!-- サイドバー背景 -->
    <div class="sidebar-backdrop" x-show="sidebarOpen" @click="sidebarOpen = false" x-transition.opacity></div>

    <!-- サイドバー -->
    <aside class="sidebar" :class="sidebarOpen ? 'sidebar-open' : ''" id="filters" :aria-hidden="isMobile && !sidebarOpen ? 'true' : 'false'">
      <div class="sidebar-close-row">
        <span class="sidebar-drawer-title" x-text="t('filterButton')"></span>
        <button type="button" class="sidebar-close" @click="sidebarOpen = false" aria-label="Close">&times;</button>
      </div>

      <div class="sidebar-section sidebar-search">
        <h3 x-text="t('search')"></h3>
        <input type="search" x-model="searchQuery" :placeholder="t('searchPlaceholder')" class="search-input" :aria-label="t('search')">
      </div>

      <div class="sidebar-section">
        <h3 x-text="t('sort')"></h3>
        <select x-model="sortKey" class="sort-select" :aria-label="t('sort')">
          <option value="name" x-text="t('sortName')"></option>
          <option value="price_asc" x-text="t('sortPriceAsc')"></option>
          <option value="price_desc" x-text="t('sortPriceDesc')"></option>
          <option value="review" x-text="t('sortReview')"></option>
          <option value="discount" x-text="t('sortDiscount')"></option>
        </select>
      </div>

      <div class="sidebar-section">
        <h3 x-text="t('sale')"></h3>
        <select x-model="saleFilter" class="sort-select" :aria-label="t('sale')">
          <option value="off" x-text="t('genreAll')"></option>
          <option value="all" x-text="t('saleAll')"></option>
          <option value="sale90" x-text="t('sale90')"></option>
          <option value="sale80" x-text="t('sale80')"></option>
          <option value="sale70" x-text="t('sale70')"></option>
          <option value="sale60" x-text="t('sale60')"></option>
          <option value="sale50" x-text="t('sale50')"></option>
          <option value="sale40" x-text="t('sale40')"></option>
          <option value="sale30" x-text="t('sale30')"></option>
          <option value="sale20" x-text="t('sale20')"></option>
          <option value="sale10" x-text="t('sale10')"></option>
        </select>
        <label class="filter-check">
          <input type="checkbox" x-model="showOnlyWithArticle">
          <span x-text="t('onlyArticle')"></span>
        </label>
      </div>

      <div class="sidebar-section">
        <h3 x-text="t('genre')"></h3>
        <div class="genre-list">
          <button type="button" class="genre-chip" :class="selectedGenres.length === 0 ? 'genre-active' : ''" @click="selectedGenres = []">
            <span x-text="t('genreAll')"></span>
            <span class="genre-count" x-text="mainGames.length"></span>
          </button>
          <template x-for="g in allMainGenres" :key="g.name">
            <button type="button" class="genre-chip" :class="selectedGenres.includes(g.name) ? 'genre-active' : ''" @click="toggleGenre(g.name)">
              <span x-text="g.name"></span>
              <span class="genre-count" x-text="g.count"></span>
            </button>
          </template>
        </div>
      </div>

      <div class="sidebar-section" x-show="allTags.length > 0">
        <h3 x-text="t('tags')"></h3>
        <div class="genre-list">
          <template x-for="tag in allTags" :key="tag.name">
            <button type="button" class="genre-chip" :class="selectedGenres.includes(tag.name) ? 'genre-active' : ''" @click="toggleGenre(tag.name)">
              <span x-text="tag.name"></span>
              <span class="genre-count" x-text="tag.count"></span>
            </button>
          </template>
        </div>
      </div>

      <div class="sidebar-apply-row">
        <button type="button" class="sidebar-apply" @click="sidebarOpen = false" x-text="`${filteredGames.length}${t('showing')}`"></button>
      </div>

      <!-- サイドバー広告 -->
      <div class="sidebar-section ad-sidebar">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-7086371722392050"
             data-ad-slot="2327142442"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>
    </aside>

    <!-- メインコンテンツ -->
    <main class="main-content">

      <section class="game-list" id="shelf">
        <h2 class="shelf-heading"><span x-text="t('gameList')"></span></h2>

        <!-- モバイル用ツールバー -->
        <div class="mobile-toolbar">
          <input type="search" x-model="searchQuery" :placeholder="t('searchPlaceholder')" class="search-input" :aria-label="t('search')">
          <button type="button" class="filter-button" @click="sidebarOpen = true" aria-controls="filters" :aria-expanded="sidebarOpen">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 5h14M6 10h8M8.5 15h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
            <span x-text="t('filterButton')"></span>
            <span class="filter-count" x-show="activeFilterCount > 0" x-text="activeFilterCount"></span>
          </button>
        </div>

        <div class="filter-status" x-show="isFiltering">
          <span x-text="`${filteredGames.length}${t('showing')}`"></span>
          <button type="button" class="clear-filter" @click="clearFilters()" x-text="t('clearFilter')"></button>
        </div>

        <div class="game-grid-wrap">
          <template x-for="(g, idx) in visibleGames" :key="g.appid">
            <div style="display: contents">
              <!-- 6件ごとに広告を挿入 -->
              <template x-if="idx > 0 && idx % 6 === 0">
                <div class="ad-slot-inline" x-init="$nextTick(() => { try { (adsbygoogle = window.adsbygoogle || []).push({}) } catch(e) {} })">
                  <ins class="adsbygoogle"
                    style="display:block"
                    data-ad-client="ca-pub-7086371722392050"
                    data-ad-slot="4953305789"
                    data-ad-format="auto"
                    data-full-width-responsive="true"></ins>
                </div>
              </template>
              <article class="game-card" :class="isR18(g) ? 'game-card-r18' : ''">
                <!-- R18 年齢ゲート -->
                <template x-if="isR18(g) && !isAgeConfirmed(g)">
                  <div class="age-gate">
                    <div class="age-gate-inner">
                      <span class="age-gate-badge" x-text="t('ageBadge')"></span>
                      <h3 class="game-name" x-text="gameName(g)"></h3>
                      <p class="age-gate-msg" x-text="t('ageConfirm')"></p>
                      <div class="age-gate-buttons">
                        <button type="button" class="btn-age-yes" @click="confirmAge(g.appid)" x-text="t('ageYes')"></button>
                        <a :href="`https://store.steampowered.com/app/${g.appid}/`" target="_blank" rel="noopener" class="btn-age-no" x-text="t('viewOnSteam')"></a>
                      </div>
                    </div>
                  </div>
                </template>
                <!-- 通常表示 -->
                <template x-if="!isR18(g) || isAgeConfirmed(g)">
                  <div class="game-card-inner">
                    <a :href="`https://store.steampowered.com/app/${g.appid}/`" target="_blank" rel="noopener" class="game-card-link">
                      <div class="game-img-wrap">
                        <img :src="g.header_image" :alt="gameName(g)" class="game-header-img" loading="lazy" width="460" height="215">
                        <span class="r18-badge" x-show="isR18(g)" x-text="t('ageBadge')"></span>
                        <span class="card-stamp" x-show="g.discount_percent > 0" x-text="`-${g.discount_percent}%`"></span>
                      </div>
                      <div class="game-body">
                        <p class="game-genre-line" x-text="gameMainGenres(g).slice(0, 3).join(' / ')"></p>
                        <h3 class="game-name" x-text="gameName(g)"></h3>
                        <p class="game-desc" x-text="gameDesc(g)"></p>
                        <div class="recommend-badges">
                          <span class="curator-stamp">
                            <img src="img/scala.png" alt="Dr.スカラ" class="recommend-avatar" x-show="!g.by || g.by === 'scala' || g.by === 'both'">
                            <img src="img/kotori.png" alt="ことり" class="recommend-avatar" x-show="g.by === 'kotori' || g.by === 'both'">
                          </span>
                          <span class="recommend-badge" :class="g.recommend === 'niche' ? 'recommend-niche' : 'recommend-all'" x-text="g.recommend === 'niche' ? t('recommendNiche') : t('recommendAll')"></span>
                          <span class="recommend-badge recommend-multi" x-show="g.multi" x-text="t('recommendMulti')"></span>
                        </div>
                        <div class="game-foot">
                          <span class="game-detail">
                            <span class="game-release" x-text="gameRelease(g)"></span>
                            <span class="review-label" x-show="g.review_score_desc" x-text="reviewText(g)"></span>
                          </span>
                          <span class="game-price-row">
                            <template x-if="g.discount_percent > 0">
                              <span class="price-original" x-text="formatYen(g.price_initial)"></span>
                            </template>
                            <span class="price-final" :class="g.discount_percent > 0 ? 'price-sale' : ''" x-text="g.is_free ? t('free') : formatYen(g.price_final)"></span>
                          </span>
                        </div>
                      </div>
                    </a>
                    <template x-if="g.has_article">
                      <a :href="articlePath(g.slug)" class="article-link-bar">
                        <img src="img/scala.png" alt="" class="article-link-avatar">
                        <img src="img/kotori.png" alt="" class="article-link-avatar">
                        <span x-text="t('readArticle')"></span>
                        <span class="article-link-arrow" aria-hidden="true">&rarr;</span>
                      </a>
                    </template>
                  </div>
                </template>
              </article>
            </div>
          </template>
        </div>
        <p class="no-results" x-show="filteredGames.length === 0" x-text="t('noResults')"></p>
        <div class="show-more-row" x-show="filteredGames.length > visibleCount">
          <button type="button" class="show-more" @click="visibleCount += pageSize">
            <span x-text="t('showMore')"></span>
            <span class="show-more-rest" x-text="`${t('remaining')} ${filteredGames.length - visibleCount}`"></span>
          </button>
        </div>
      </section>

      <!-- ゲーム一覧〜記事間の広告 -->
      <div class="ad-slot ad-slot-between">
        <ins class="adsbygoogle"
          style="display:block"
          data-ad-client="ca-pub-7086371722392050"
          data-ad-slot="4953305789"
          data-ad-format="auto"
          data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>

      <section class="articles-section" x-show="siteArticles.length > 0">
        <h2 class="shelf-heading"><span x-text="t('articles')"></span></h2>
        <div class="article-grid">
          <template x-for="(a, i) in siteArticles" :key="a.slug">
            <a :href="articlePath(a.slug)" class="article-card">
              <h3 x-text="a.title"></h3>
              <div class="article-tags">
                <template x-for="tag in (a.tags || [])" :key="tag">
                  <span class="tag" x-text="tag"></span>
                </template>
              </div>
            </a>
          </template>
        </div>
      </section>

      <section class="wishlist-section" x-show="comingSoonGames.length > 0">
        <h2 class="shelf-heading"><span x-text="t('comingSoon')"></span></h2>
        <div class="wishlist-grid">
          <template x-for="g in comingSoonGames" :key="g.appid">
            <a :href="`https://store.steampowered.com/app/${g.appid}/`" target="_blank" rel="noopener" class="wishlist-card">
              <img :src="g.header_image" :alt="gameName(g)" class="wishlist-img" loading="lazy" width="460" height="215">
              <div class="wishlist-body">
                <span class="coming-soon-badge" x-text="t('comingSoonBadge')"></span>
                <h3 class="wishlist-name" x-text="gameName(g)"></h3>
                <p class="wishlist-desc" x-text="gameDesc(g)"></p>
              </div>
            </a>
          </template>
        </div>
      </section>

      <section class="free-games-section" x-show="freeGames.length > 0">
        <h2 class="shelf-heading"><span x-text="t('freeGames')"></span></h2>
        <div class="wishlist-grid">
          <template x-for="g in freeGames" :key="g.appid">
            <a :href="`https://store.steampowered.com/app/${g.appid}/`" target="_blank" rel="noopener" class="wishlist-card">
              <img :src="g.header_image" :alt="gameName(g)" class="wishlist-img" loading="lazy" width="460" height="215">
              <div class="wishlist-body">
                <span class="free-badge" x-text="t('freeGamesBadge')"></span>
                <h3 class="wishlist-name" x-text="gameName(g)"></h3>
                <p class="wishlist-desc" x-text="gameDesc(g)"></p>
              </div>
            </a>
          </template>
        </div>
      </section>

      <section class="tools-section" x-show="toolGames.length > 0">
        <h2 class="shelf-heading"><span x-text="t('tools')"></span></h2>
        <div class="wishlist-grid">
          <template x-for="g in toolGames" :key="g.appid">
            <a :href="`https://store.steampowered.com/app/${g.appid}/`" target="_blank" rel="noopener" class="wishlist-card">
              <img :src="g.header_image" :alt="gameName(g)" class="wishlist-img" loading="lazy" width="460" height="215">
              <div class="wishlist-body">
                <span class="tool-badge" x-text="t('toolsBadge')"></span>
                <h3 class="wishlist-name" x-text="gameName(g)"></h3>
                <p class="wishlist-desc" x-text="gameDesc(g)"></p>
                <div class="game-price-row">
                  <template x-if="g.discount_percent > 0">
                    <span class="discount-badge" x-text="`-${g.discount_percent}%`"></span>
                  </template>
                  <span class="price-final" :class="g.discount_percent > 0 ? 'price-sale' : ''" x-text="g.is_free ? t('free') : formatYen(g.price_final)"></span>
                </div>
              </div>
            </a>
          </template>
        </div>
      </section>

    </main>
  </div>
</div>

<!-- フッター広告 -->
<div class="ad-slot-footer">
    <ins class="adsbygoogle"
         style="display:block; margin: 0 auto;"
         data-ad-client="ca-pub-7086371722392050"
